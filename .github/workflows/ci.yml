name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Publication hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A public repository has to be safe to publish, and stay that way. This
      # catches the regressions that no test notices: a weakened .gitignore, an
      # import that is not a declared dependency, a sensitive file in the
      # tree, and a README that disagrees with package.json about Node.
      - name: Check publication hygiene
        run: node scripts/check-publication-hygiene.mjs

  frontend:
    name: Type-check, lint, test and build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  rust:
    name: Rust persistence tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Tauri crate links the system webview, so these have to be present
      # before cargo runs.
      - name: Install the system libraries Tauri links against
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test
