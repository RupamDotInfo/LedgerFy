name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Type-check, lint, test and build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  rust:
    name: Rust persistence tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The Tauri crate links the WebView2 loader, so the SDK has to be
      # present before cargo runs. The runtime alone is not enough.
      - name: Install the WebView2 SDK
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/wv2ware/wv2-devenv-ps-module.git
          Install-Product -Path "$PWD/wv2-devenv-ps-module"
          Write-Host "::add-path::$env:WEBVIEW2_DEPS"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test
