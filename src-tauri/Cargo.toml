[package]
name = "ledgerfy"
version = "0.1.0"
description = "LedgerFy — offline-first desktop accounting and ERP"
authors = ["LedgerFy"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ledgerfy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
